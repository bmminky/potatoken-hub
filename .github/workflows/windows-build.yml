name: Windows build

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build windows/PotatokenHub/PotatokenHub.csproj -c Release

      - name: Publish self-contained x64
        run: >
          dotnet publish windows/PotatokenHub/PotatokenHub.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: potatoken-hub-windows-x64
          path: publish/win-x64
